<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============ Technician top navbar ============ -->
<nav class="pt-navbar" th:fragment="nav">
    <div class="container-fluid px-3 px-lg-4">
        <div class="pt-navbar-inner">
            <a th:href="@{/home}" class="ms-brand text-decoration-none text-dark">
                <div class="ms-brand-mark ms-brand-mark-solid"><i class="bi bi-activity"></i></div>
                <div>
                    <div class="fw-bold">MediScan AI</div>
                    <div class="small text-muted">Trạm chụp X-quang</div>
                </div>
            </a>

            <div class="d-flex align-items-center gap-2">
                  <div class="dropdown">
                      <button class="btn ms-icon-btn position-relative" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Thông báo">
                          <i class="bi bi-bell"></i>
                          <span class="ms-notification-count" th:if="${headerUnreadCount != null && headerUnreadCount > 0}"
                                th:text="${headerUnreadCount}">0</span>
                      </button>
                      <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 p-0 rounded-4" style="width: 380px; max-width: calc(100vw - 2rem); overflow: hidden;">
                          <!-- Header -->
                          <div class="d-flex align-items-center justify-content-between p-3 bg-white border-bottom">
                              <div class="fw-bold text-dark d-flex align-items-center gap-2 fs-6">
                                  <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                      <i class="bi bi-bell-fill"></i>
                                  </div>
                                  Thông báo
                                  <span class="badge bg-danger rounded-pill px-2 py-1" style="font-size: 0.7rem;" th:if="${headerUnreadCount != null && headerUnreadCount > 0}" th:text="${headerUnreadCount} + ' mới'">0 mới</span>
                              </div>
                          </div>
  
                          <!-- Scrollable Content -->
                          <div style="max-height: 380px; overflow-y: auto; background-color: #f8fafc;">
                              <div th:if="${headerNotifications == null or #lists.isEmpty(headerNotifications)}" class="text-center text-muted p-5 bg-white h-100">
                                  <i class="bi bi-bell-slash fs-2 text-secondary opacity-25 mb-2 d-block"></i>
                                  <div class="small fw-medium">Bạn không có thông báo nào</div>
                              </div>
                              <div th:if="${headerNotifications != null and !#lists.isEmpty(headerNotifications)}">
                                  <a th:each="n : ${headerNotifications}"
                                     th:href="@{/notifications/click(id=${n.notificationId})}"
                                     class="ms-notif-item"
                                     th:classappend="${!n.read} ? ' unread' : ''">
                                      <div class="d-flex align-items-center justify-content-between">
                                          <div class="notif-title text-truncate me-2" th:text="${n.title}">Tiêu đề thông báo</div>
                                          <span class="badge bg-primary bg-opacity-10 text-primary flex-shrink-0" style="font-size: 0.65rem;" th:if="${!n.read}">Mới</span>
                                      </div>
                                      <div class="notif-body" th:text="${n.message}">Nội dung thông báo</div>
                                      <div class="notif-time">
                                          <i class="bi bi-clock"></i> <span th:text="${#temporals.format(n.createdAt, 'HH:mm • dd/MM/yyyy')}">10:30 • 20/07/2026</span>
                                      </div>
                                  </a>
                              </div>
                          </div>
  
                          <!-- Footer -->
                          <div class="p-0 text-center border-top bg-white">
                              <a th:href="@{/notifications}" class="btn btn-link text-decoration-none w-100 fw-semibold text-primary py-3">
                                  Xem tất cả thông báo <i class="bi bi-arrow-right ms-1"></i>
                              </a>
                          </div>
                      </div>
                  </div>
                <div class="dropdown">
                    <button class="btn ms-account-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span class="ms-avatar ms-avatar-primary"
                              th:text="${currentUser != null ? #strings.substring(currentUser.fullName, 0, 1).toUpperCase() : 'K'}">K</span>
                        <span class="d-none d-md-block text-start">
                            <span class="d-block fw-bold" th:text="${currentUser != null ? currentUser.fullName : ''}">Kỹ thuật viên</span>
                            <span class="d-block small text-muted">Kỹ thuật viên</span>
                        </span>
                        <i class="bi bi-chevron-down small text-muted"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end ms-dropdown-panel">
                        <a class="dropdown-item py-2" th:href="@{/home}"><i class="bi bi-house me-2"></i>Tổng quan</a>
                        <a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a>
                        <a class="dropdown-item py-2" th:href="@{/profile/edit}"><i class="bi bi-pencil-square me-2"></i>Chỉnh sửa thông tin</a>
                        <a class="dropdown-item py-2" th:href="@{/notifications}"><i class="bi bi-bell me-2"></i>Thông báo</a>
                        <a class="dropdown-item py-2" th:href="@{/change-password}"><i class="bi bi-key me-2"></i>Đổi mật khẩu</a>
                        <form th:action="@{/logout}" method="post" class="px-3 pt-2 pb-2">
                            <button type="submit" class="btn ms-btn ms-btn-primary text-white w-100">Đăng xuất</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ============ Technician sidebar ============ -->
<div class="rc-sidebar" th:fragment="sidebar(active)">
    <div class="d-grid gap-1">
        <a class="rc-nav-item" th:classappend="${active == 'upload'} ? ' active'" th:href="@{/technician/xray-upload}"><i class="bi bi-camera"></i> Chụp X-quang</a>
        <a class="rc-nav-item" th:classappend="${active == 'recent'} ? ' active'" th:href="@{/technician/recent}"><i class="bi bi-clock-history"></i> Lịch sử chụp</a>
        <hr class="my-2">
        <a class="rc-nav-item" th:href="@{/notifications}"><i class="bi bi-bell"></i> Thông báo</a>
    </div>
</div>


<script th:src="@{/js/status-translator.js}"></script>
</body>
</html>
