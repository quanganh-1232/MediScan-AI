<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Technician Upload - MediScan AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/mediscan-ui.css}" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{technician/fragments/technician-shell :: nav}"></div>
<main class="container-fluid px-3 px-lg-4 py-4">
    <div class="row g-4">
        <div class="col-12 col-xl-3 order-2 order-xl-1">
            <div th:replace="~{technician/fragments/technician-shell :: sidebar('upload')}"></div>
        </div>
        <div class="col-12 col-xl-9 order-1 order-xl-2">
            
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h1 class="fw-bold mb-1 fs-3"><i class="bi bi-camera text-primary me-2"></i>Chụp ảnh và gửi bác sĩ</h1>
                    <div class="text-muted">Quy trình tải lên hệ thống ảnh X-quang của bệnh nhân để AI phân tích.</div>
                </div>
            </div>

            <section class="pt-card p-4 mb-4">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}">Lỗi</div>
                <form id="technicianCaptureForm" th:action="@{/technician/xray-upload}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    
                    <div class="mb-3">
                        <label class="form-label fw-medium" for="uploadAppointmentId">Lịch hẹn (đã xếp phòng chụp) <span class="text-danger">*</span></label>
                        <select id="uploadAppointmentId" name="appointmentId" class="form-select" required>
                            <option value="">-- Chọn lịch hẹn --</option>
                            <option th:each="appt : ${eligibleAppointments}" th:value="${appt.appointmentId}"
                                    th:text="${appt.patient.fullName + ' — BS. ' + appt.doctor.fullName + ' — ' + #temporals.format(appt.scheduledTime, 'HH:mm dd/MM/yyyy')}">
                            </option>
                        </select>
                        <div class="form-text" th:if="${#lists.isEmpty(eligibleAppointments)}">
                            Không có lịch hẹn nào đang chờ chụp. Hãy kiểm tra lại lịch xếp phòng bên bộ phận Lễ tân.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium" for="xrayImage">Chọn ảnh X-Ray <span class="text-danger">*</span></label>
                        <input type="file" id="xrayImage" name="image" class="form-control" accept=".png,.jpg,.jpeg,.dcm" required>
                        <div class="form-text">Hỗ trợ các định dạng: PNG, JPG, JPEG và DICOM (.dcm)</div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-cloud-upload me-2"></i> Tải ảnh lên và phân tích AI
                    </button>
                </form>
            </section>

            

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const form = document.getElementById('technicianCaptureForm');
    form.addEventListener('submit', function () {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
        overlay.style.zIndex = '9999';
        overlay.innerHTML = '<div class="d-flex justify-content-center align-items-center h-100"><div class="text-center text-white"><div class="spinner-border text-light mb-3" role="status" style="width: 3rem; height: 3rem;"></div><h5 class="fw-bold">Đang xử lý hình ảnh...</h5><div class="text-white-50">Hệ thống đang tải ảnh lên và phân tích AI, vui lòng chờ trong giây lát.</div></div></div>';
        document.body.appendChild(overlay);
    });

    window.addEventListener('DOMContentLoaded', function () {
        const success = [[${success}]];
        if (success) {
            const modalHtml = '<div class="modal fade show" tabindex="-1" style="display:block; background: rgba(0,0,0,.5);"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 rounded-4 shadow"><div class="modal-header border-0 pb-0"><button type="button" class="btn-close" id="successClose"></button></div><div class="modal-body text-center pt-0 pb-4"><div class="rounded-circle bg-success bg-opacity-10 text-success d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px;"><i class="bi bi-check-lg fs-1"></i></div><h4 class="fw-bold mb-2">Gửi thành công!</h4><p class="text-muted mb-4">Ảnh X-Ray đã được tải lên hệ thống, AI đã phân tích và gửi kết quả đến bác sĩ thành công.</p><a href="/technician/xray-upload" class="btn btn-primary w-100 fw-semibold py-2">Tiếp tục công việc</a></div></div></div></div>';
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('successClose').addEventListener('click', function () {
                window.location.href = '/technician/xray-upload';
            });
        }
    });
</script>


<script th:src="@{/js/status-translator.js}"></script>
</body>
</html>
