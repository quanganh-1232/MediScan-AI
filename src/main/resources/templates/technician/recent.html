<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử chụp - Kỹ thuật viên - MediScan AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link th:href="@{/css/mediscan-ui.css}" rel="stylesheet">
    <link th:href="@{/css/portal.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{technician/fragments/technician-shell :: nav}"></div>
<main class="container-fluid px-3 px-lg-4 py-4">
    <div class="row g-4">
        <div class="col-12 col-xl-3 order-2 order-xl-1">
            <div th:replace="~{technician/fragments/technician-shell :: sidebar('recent')}"></div>
        </div>
        <div class="col-12 col-xl-9 order-1 order-xl-2">
            
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h1 class="fw-bold mb-1 fs-3"><i class="bi bi-clock-history text-primary me-2"></i>Lịch sử chụp</h1>
                    <div class="text-muted">Xem lại các hồ sơ X-quang bạn đã thực hiện tải lên hệ thống.</div>
                </div>
                <a th:href="@{/technician/xray-upload}" class="btn btn-primary fw-semibold shadow-sm">
                    <i class="bi bi-camera me-1"></i> Chụp ca mới
                </a>
            </div>

            <section class="pt-card p-4" id="history">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">Hồ sơ đã chụp</h5>
                    <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-3 py-2" th:text="${historyRecords.size()} + ' hồ sơ'">0</span>
                </div>
                
                <div th:if="${#lists.isEmpty(historyRecords)}" class="text-center text-muted py-5">
                    <i class="bi bi-folder2-open fs-1 d-block mb-3 text-secondary"></i>
                    Chưa có hồ sơ nào được tạo.
                </div>
                
                <div th:if="${!#lists.isEmpty(historyRecords)}" class="table-responsive">
                    <table id="historyTable" class="table ms-table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Mã HS</th>
                                <th>Bệnh nhân</th>
                                <th>Trạng thái</th>
                                <th>Thời gian chụp</th>
                                <th class="text-end">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="record : ${historyRecords}">
                                <td th:text="${record.recordCode}" class="fw-semibold text-dark">XR-0001</td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                                            <i class="bi bi-person"></i>
                                        </div>
                                        <span class="fw-medium" th:text="${record.patient.fullName}">Patient Name</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${record.status == 'COMPLETED' ? 'bg-success' : (record.status == 'PENDING_AI' ? 'bg-secondary' : 'bg-warning')}" 
                                          th:text="${record.status}">PENDING_AI</span>
                                </td>
                                <td th:text="${#temporals.format(record.createdAt, 'HH:mm - dd/MM/yyyy')}">date</td>
                                <td class="text-end">
                                    <a th:href="@{/technician/record/{id}(id=${record.recordId})}" class="btn btn-sm btn-outline-primary">
                                        Chi tiết
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <div class="small text-muted">
                            Hiển thị 8 hồ sơ / trang
                        </div>
                        <ul class="pagination pagination-sm mb-0" id="historyPagination"></ul>
                    </div>
                </div>
            </section>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const rowsPerPage = 8;
        const table = document.querySelector("#historyTable tbody");
        const pagination = document.getElementById("historyPagination");

        if (!table || !pagination) {
            return;
        }

        const dataRows = Array.from(table.querySelectorAll("tr"));

        if (dataRows.length <= rowsPerPage) {
            pagination.style.display = "none";
            return;
        }

        const pageCount = Math.ceil(dataRows.length / rowsPerPage);
        let currentPage = 1;

        function showPage(page) {
            currentPage = page;

            dataRows.forEach((row, index) => {
                row.style.display =
                    (index >= (page - 1) * rowsPerPage &&
                        index < page * rowsPerPage)
                        ? ""
                        : "none";
            });

            updatePagination();
        }

        function updatePagination() {
            pagination.innerHTML = "";

            // Previous button
            const prev = document.createElement("li");
            prev.className = "page-item" + (currentPage === 1 ? " disabled" : "");
            prev.innerHTML = '<a class="page-link" href="#"><i class="bi bi-chevron-left"></i></a>';
            prev.addEventListener("click", function (e) {
                e.preventDefault();
                if (currentPage > 1) {
                    showPage(currentPage - 1);
                }
            });
            pagination.appendChild(prev);

            // Page numbers
            for (let i = 1; i <= pageCount; i++) {
                const li = document.createElement("li");
                li.className = "page-item" + (i === currentPage ? " active" : "");
                li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                li.addEventListener("click", function (e) {
                    e.preventDefault();
                    showPage(i);
                });
                pagination.appendChild(li);
            }

            // Next button
            const next = document.createElement("li");
            next.className = "page-item" + (currentPage === pageCount ? " disabled" : "");
            next.innerHTML = '<a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a>';
            next.addEventListener("click", function (e) {
                e.preventDefault();
                if (currentPage < pageCount) {
                    showPage(currentPage + 1);
                }
            });
            pagination.appendChild(next);
        }

        showPage(1);

    });
</script>

<script th:src="@{/js/status-translator.js}"></script>
</body>
</html>
